<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerSignature Off

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes -ExecCGI

        # Only index.php may execute; no other PHP-like file is ever interpreted.
        <FilesMatch "\.(php|phtml|phar|php[0-9])$">
            Require all denied
        </FilesMatch>
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>

    # Uploads live in writable/ (outside the document root); defence in depth:
    <Directory /var/www/html/writable>
        Require all denied
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
